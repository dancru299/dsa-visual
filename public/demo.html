<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: top bar, then three columns (course tree | animated stage | step notes).
     Soft neo-brutalism: ink outlines, hard offset shadows, flat pastel fills, monospace type. */
  --paper:#f4efe4;
  --surface:#fffcf6;
  --ink:#211d2c;
  --muted:#6b6577;
  --line:#e2d9c8;
  --grid:rgba(120,100,70,.10);

  --lav:#cdc2ec; --lav-t:#e6e0f7; --lav-s:#a393d8;
  --mint:#bde3b1; --mint-t:#dcf0d4; --mint-s:#8cc47e;
  --sun:#f6d77b; --sun-t:#fcecb8; --sun-s:#deb043;
  --rose:#f4b8b0; --rose-t:#fbdcd8; --rose-s:#e08a80;
  --sky:#bad5f2; --sky-t:#dce9f9; --sky-s:#88b1df;
  --peach:#f7c696; --peach-t:#fde2c8; --peach-s:#e3a061;
  --ash:#dfd9ce; --ash-t:#eeeae3; --ash-s:#c3bcae;

  --bad:#c0443a; --good:#2f7a2c;
  --font:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hard:3px 3px 0 var(--ink);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
code{font-family:var(--font);background:var(--sun-t);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.94em;white-space:nowrap}
h1,h2,h3{text-wrap:balance}
svg{flex:none}
.ic{display:inline-flex}

/* ---------- top bar ---------- */
.top{height:58px;display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1.5px solid var(--line);background:var(--paper)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo .hl{background:linear-gradient(transparent 56%,var(--mint) 56%);padding:0 3px}
.tabs{display:flex;gap:6px;margin:0 auto}
.tab{display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;background:none;border-radius:9px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tab:hover{background:var(--surface);border-color:var(--line)}
.tab.on{background:var(--mint);border-color:var(--ink);box-shadow:var(--hard)}
.search{position:relative;width:270px;display:block}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 62px 8px 34px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:var(--hard)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:inherit;font-size:10.5px;border:1.5px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted);background:var(--paper)}
.top .menu-btn{display:none}

/* ---------- columns ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr) 348px;height:calc(100% - 58px)}
.side,.main,.panel{overflow:auto;min-height:0}
.side{padding:16px 10px 24px 14px;border-right:1.5px solid var(--line)}
.main{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.panel{padding:16px 16px 24px 2px;display:flex;flex-direction:column;gap:14px}

/* ---------- sidebar ---------- */
.side-h{display:flex;align-items:center;gap:10px;padding:2px 6px 12px;font-weight:800;font-size:14px}
.side-h small{margin-left:auto;color:var(--muted);font-weight:500;font-size:11px}
.mod-btn{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;text-align:left}
.mod-btn:hover{background:var(--surface)}
.mod-btn .chev{transition:transform .2s;color:var(--muted)}
.mod.open .chev{transform:rotate(90deg)}
.mod-btn .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:11px}
.les{list-style:none;margin:2px 0 8px 15px;padding:0 0 0 12px;border-left:1.5px solid var(--line);display:none}
.mod.open .les{display:block}
.les button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:2px solid transparent;border-radius:8px;padding:3px 8px;margin:2px 0;cursor:pointer;font-size:12.5px;text-align:left}
.les button:hover{background:var(--surface)}
.les button.on{background:var(--mint);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:700}
.les button.soon{color:var(--muted)}
.les .ok-ic{color:var(--good)}
.tagsoon{margin-left:auto;font-size:9.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.empty{color:var(--muted);font-size:12px;padding:0 8px}

/* ---------- lesson card ---------- */
.lesson{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;flex:1 0 auto}
.lh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:500}
.lh h1{font-size:28px;line-height:1.15;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.lh p{margin:0;color:var(--muted);font-size:12.5px;max-width:64ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:11.5px;font-weight:700;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.chip.c1{background:var(--sun-t)}.chip.c2{background:var(--mint-t)}.chip.c3{background:var(--lav-t)}

/* ---------- stage ---------- */
.stage{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:520px;
  background-color:#faf6ee;
  background-image:repeating-linear-gradient(30deg,var(--grid) 0 1px,transparent 1px 26px),repeating-linear-gradient(150deg,var(--grid) 0 1px,transparent 1px 26px)}
.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.metrics{display:flex;gap:10px;flex-wrap:wrap;min-height:52px}
.metric{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--ink);border-radius:8px;padding:5px 12px 6px;min-width:108px}
.metric .ml{font-size:9.5px;letter-spacing:.07em;color:var(--muted);font-weight:700;text-transform:uppercase;white-space:nowrap}
.metric .mv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap}
.metric.t-bad{border-left-color:var(--bad)}.metric.t-bad .mv{color:var(--bad)}
.metric.t-good{border-left-color:var(--good)}.metric.t-good .mv{color:var(--good)}
.metric.flash{animation:flash .7s ease}
.ctrls{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:var(--hard);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--hard)}
.btn.pri{background:var(--mint)}
.viz{position:relative;flex:1;min-height:420px;container-type:inline-size}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.legend i.dash{border-radius:3px;border-style:dashed;background:rgba(246,215,123,.3)}
.stage.paused *{animation-play-state:paused!important}
.no-anim,.no-anim *{transition:none!important;animation:none!important}
.gone{opacity:0!important}
.ncard{border:2px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:4px 4px 0 var(--ink);padding:10px 12px}
.mc-h{font-size:10.5px;letter-spacing:.07em;font-weight:800;display:flex;align-items:center;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.mc-h code{letter-spacing:0;font-size:12px}

/* ---------- binary search ---------- */
.L-track,.L-ladder,.L-recap{display:none;animation:fadeIn .35s ease}
.bs[data-layer="track"] .L-track{display:block}
.bs[data-layer="ladder"] .L-ladder{display:flex}
.bs[data-layer="recap"] .L-recap{display:flex}
.bs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:2px 4px 0}
.target-pill{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:4px 6px 4px 14px;box-shadow:var(--hard);font-weight:700}
.target-pill b{display:inline-block;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:15px}
.target-pill b.bump{animation:bump .5s ease}
.hint{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
.mini{width:262px}
.mini svg{display:block}
.mini text{font-family:var(--font)}
.mini .g{stroke:var(--line);stroke-width:1}
.mini .ax{stroke:var(--ink);stroke-width:1.5}
.mini .mk{stroke:var(--muted);stroke-dasharray:3 3}
.mini .tl{font-size:8.5px;fill:var(--muted)}
.mini .c-lin{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-linecap:round}
.mini .c-log{fill:none;stroke:var(--good);stroke-width:2.5;stroke-linejoin:round}
.mini .d-lin{fill:var(--rose);stroke:var(--ink);stroke-width:1.5}
.mini .d-log{fill:var(--mint);stroke:var(--ink);stroke-width:1.5}
.mini .vl{font-size:10px;font-weight:800}
.mini .nm{font-size:9px;font-weight:700}
.mini text.lin{fill:var(--bad)}.mini text.log{fill:var(--good)}
.mini .lin,.mini .log{transition:opacity .3s}
.mini[data-hl="lin"] .log,.mini[data-hl="log"] .lin{opacity:.18}

.bs-scroll{overflow-x:auto;padding:0 40px}
.bs-track{position:relative;height:306px;min-width:600px;max-width:820px;margin:0 auto}
.row{position:absolute;left:0;right:0;top:124px}
.slab{position:absolute;left:-16px;right:-16px;bottom:-20px;height:28px;background:var(--surface);border:2px solid var(--ink);border-radius:10px;box-shadow:0 7px 0 0 #e7dcc8,0 7px 0 2px var(--ink)}
.range{position:absolute;top:-20px;bottom:-6px;border:2px dashed var(--ink);border-radius:12px;background:rgba(246,215,123,.22);transition:left .5s cubic-bezier(.45,0,.25,1),width .5s cubic-bezier(.45,0,.25,1),opacity .3s}
.cells{position:relative;z-index:1;display:grid}
.cell{position:relative;padding:0 3px;--f:var(--lav);--t:var(--lav-t);--s:var(--lav-s)}
.cell.scan{--f:var(--peach);--t:var(--peach-t);--s:var(--peach-s)}
.cell.mid{--f:var(--sun);--t:var(--sun-t);--s:var(--sun-s)}
.cell.found{--f:var(--mint);--t:var(--mint-t);--s:var(--mint-s)}
.cell.out,.cell.seen{--f:var(--ash);--t:var(--ash-t);--s:var(--ash-s)}
.cube{position:relative;transition:transform .45s cubic-bezier(.3,1.5,.6,1) var(--dl,0ms),opacity .35s ease var(--dl,0ms)}
.cube svg{display:block;width:100%;height:auto;overflow:visible}
.cube polygon{stroke:var(--ink);stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .3s ease var(--dl,0ms)}
.cube .f{fill:var(--f)}.cube .t{fill:var(--t)}.cube .s{fill:var(--s)}
.cell.mid .cube{transform:translateY(-10px)}
.cell.out .cube{transform:translateY(5px);opacity:.42}
.cell.seen .cube{opacity:.6}
.cell.found .cube{transform:translateY(-10px);animation:found .7s cubic-bezier(.3,1.5,.5,1)}
.cell.pop .cube{animation:cubeIn .5s cubic-bezier(.3,1.5,.6,1) var(--dl,0ms) both}
.num{position:absolute;left:4%;width:75%;top:19%;height:77%;display:grid;place-items:center;font-weight:800;font-size:clamp(11px,1.05vw,15px);font-variant-numeric:tabular-nums}
.cell.out .num{text-decoration:line-through;text-decoration-thickness:2px}
.idx{position:absolute;left:0;right:0;top:calc(100% + 3px);text-align:center;font-size:10px;color:var(--muted)}
.burst{position:absolute;left:42%;top:50%;z-index:5;pointer-events:none}
.burst span{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);background:var(--mint);animation:burst .75s ease-out forwards}
.burst span:nth-child(2n){background:var(--sun)}
.searcher{position:absolute;bottom:calc(100% + 14px);transform:translateX(-50%);z-index:4;transition:left .55s cubic-bezier(.5,0,.25,1),opacity .3s;--bx:-50%;--tx:50%}
.searcher.al{--bx:-20px;--tx:20px}
.searcher.ar{--bx:calc(-100% + 20px);--tx:calc(100% - 20px)}
.fig svg{display:block}
.fig.hop{animation:hop .55s cubic-bezier(.3,0,.4,1)}
.fig.walk{animation:stepb .28s ease}
.bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(var(--bx)) scale(.85);transform-origin:50% 100%;opacity:0;white-space:nowrap;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-size:12px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:opacity .2s,transform .3s cubic-bezier(.3,1.5,.6,1)}
.bubble.on{opacity:1;transform:translateX(var(--bx)) scale(1)}
.bubble.good{background:var(--mint)}.bubble.bad{background:var(--rose-t)}
.bubble::after{content:'';position:absolute;left:var(--tx);bottom:-6px;width:9px;height:9px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.ptr{position:absolute;top:calc(100% + 30px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left .5s cubic-bezier(.45,0,.25,1),opacity .3s}
.ptr::before{content:'';border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid var(--ink)}
.ptr i{display:block;width:2px;height:var(--stem);background:var(--ink)}
.ptr span{border:2px solid var(--ink);border-radius:7px;padding:0 8px;font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);line-height:1.6}
.ptr.lo{--stem:6px;z-index:3}.ptr.lo span{background:var(--sky)}
.ptr.hi{--stem:34px;z-index:2}.ptr.hi span{background:var(--rose)}
.ins{position:absolute;top:-14px;height:calc(100% + 138px);border-left:2.5px dashed var(--bad);opacity:0;transition:opacity .3s;z-index:1;pointer-events:none}
.ins.on{opacity:1}
.ins span{position:absolute;bottom:0;left:0;transform:translateX(-50%);white-space:nowrap;background:var(--rose-t);border:2px solid var(--ink);border-radius:7px;padding:0 8px;font-size:11px;font-weight:800;box-shadow:2px 2px 0 var(--ink)}

.L-ladder{gap:22px;align-items:flex-start;flex-wrap:wrap;padding:8px 4px}
.ladder{flex:1 1 440px;display:flex;flex-direction:column;gap:12px}
.lrow{display:grid;grid-template-columns:72px auto 1fr;align-items:center;gap:12px;opacity:.18;transition:opacity .3s}
.lrow.show{opacity:1}
.lrow .ll{font-size:11px;color:var(--muted);font-weight:700}
.sqs{display:flex;gap:4px}
.sq{width:15px;height:15px;border:2px solid var(--ink);border-radius:4px;background:var(--lav);box-shadow:2px 2px 0 var(--ink);display:block}
.lrow.show .sq{animation:sqIn .35s cubic-bezier(.3,1.6,.6,1) both;animation-delay:calc(var(--d) * 20ms)}
.lrow.last .sq{background:var(--mint)}
.lrow .lc{font-weight:800}
.bigt{flex:0 1 300px}
.bigt table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
.bigt th{font-size:9.5px;letter-spacing:.07em;color:var(--muted);text-align:right;padding:2px 6px 5px;border-bottom:1.5px solid var(--line);text-transform:uppercase}
.bigt td{padding:6px;text-align:right;border-bottom:1px dashed var(--line);opacity:.15;transition:opacity .3s}
.bigt th:first-child,.bigt td:first-child{text-align:left}
.bigt tr.show td{opacity:1}
.bigt td.lin{color:var(--bad)}.bigt td.bin{color:var(--good);font-weight:800}
.note{margin:8px 0 0;font-size:11px;color:var(--muted)}

.L-recap{gap:16px;align-items:flex-start;flex-wrap:wrap;padding:4px}
.code{flex:1 1 330px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:4px 4px 0 var(--ink);overflow:hidden;min-width:0}
.code-h{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:2px solid var(--ink);background:var(--lav-t);font-size:11px;font-weight:700}
.code-h i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;background:var(--rose)}
.code-h i:nth-child(2){background:var(--sun)}.code-h i:nth-child(3){background:var(--mint)}
.code-h span{margin-left:6px}
.code pre{margin:0;padding:8px 0;font-family:var(--font);font-size:11.5px;line-height:1.7;overflow-x:auto}
.ln{display:block;white-space:pre;padding-right:12px;min-height:1.7em;transition:background .2s,box-shadow .2s}
.ln::before{content:attr(data-n);display:inline-block;width:28px;text-align:right;margin-right:12px;color:var(--muted);opacity:.6}
.ln.on{background:var(--sun-t);box-shadow:inset 4px 0 0 var(--sun-s)}
.kw{color:#7a3fb0;font-weight:700}.fn{color:#1f63a0}.nu{color:#b4601a}.str{color:#2f7a2c}.cm{color:var(--muted);font-style:italic}
.trace{flex:1 1 320px;min-width:0}
.tscroll{overflow-x:auto}
.trace table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
.trace th{font-size:9.5px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:2px 6px 5px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.trace td{padding:5px 6px;border-bottom:1px dashed var(--line);white-space:nowrap}
.trace tr{animation:rowIn .35s ease both}
.trace td:last-child{font-weight:700}
.trace .empty-row td{color:var(--muted);font-weight:400;animation:none}

/* ---------- stack ---------- */
.st{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.st-left{position:relative;padding:92px 0 64px 44px}
.tube-wrap{position:relative;width:220px}
.tube{position:relative;z-index:1;height:242px;border:3px solid var(--ink);border-top:0;border-radius:0 0 16px 16px;background:rgba(255,252,246,.8)}
.tube::before,.tube::after{content:'';position:absolute;top:0;width:14px;height:3px;background:var(--ink)}
.tube::before{left:-16px}.tube::after{right:-16px}
.plate{position:absolute;left:50%;bottom:-34px;width:300px;height:66px;transform:translateX(-50%);z-index:0}
.tube-cap{position:absolute;left:0;right:0;top:calc(100% + 40px);text-align:center;font-size:11px;color:var(--muted)}
.blk{position:absolute;left:9px;right:9px;bottom:calc(7px + var(--i) * 46px);height:36px;border:2.5px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--ink);transition:transform .6s cubic-bezier(.3,1.35,.55,1),opacity .25s,background .25s}
.blk::before{content:'';position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:3px;background:rgba(255,255,255,.55)}
.blk span{position:relative}
.blk.leaving{transition:transform .65s cubic-bezier(.55,-.35,.7,1),opacity .45s ease-in .2s}
.top-ptr{position:absolute;left:calc(100% + 10px);bottom:calc(17px + var(--i) * 46px);display:flex;align-items:center;z-index:2;transition:bottom .45s cubic-bezier(.3,1.3,.6,1)}
.top-ptr i{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:9px solid var(--ink)}
.top-ptr span{border:2px solid var(--ink);background:var(--sun);border-radius:7px;padding:0 8px;font-weight:800;font-size:11.5px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;line-height:1.7}
.top-ptr.empty span{background:var(--surface);color:var(--muted)}
.st-right{display:flex;flex-direction:column;gap:14px;min-width:0;padding-top:4px}
.st-right .code{flex:none}
.tokcard,.traycard{display:none}
.st[data-mode="brackets"] .tokcard{display:block}
.st[data-mode="basic"] .traycard,.st[data-mode="calls"] .traycard{display:block}
.tokens{display:flex;gap:9px;flex-wrap:wrap;padding:6px 0 18px}
.tk{position:relative;width:44px;height:44px;border:2.5px solid var(--ink);border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:3px 3px 0 var(--ink);transition:transform .25s,background .25s}
.tk.open{border-style:dashed}
.tk.cur{background:var(--sun);transform:translateY(-6px)}
.tk.cur::after{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid var(--ink)}
.result{display:inline-flex;align-items:center;border:2.5px solid var(--ink);border-radius:9px;padding:4px 12px;font-weight:800;font-size:12.5px;box-shadow:3px 3px 0 var(--ink);background:var(--surface)}
.result:empty{display:none}
.result.pop{animation:popIn .4s cubic-bezier(.3,1.6,.6,1)}
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:34px;align-items:center}
.tray:empty::before{content:'(trống)';color:var(--muted);font-size:11.5px}
.chipx{border:2px solid var(--ink);border-radius:8px;padding:2px 10px;font-weight:800;box-shadow:2px 2px 0 var(--ink);animation:popIn .4s cubic-bezier(.3,1.6,.6,1)}
@container (max-width:640px){
  .st{grid-template-columns:1fr}
  .st-left{padding-left:calc(50% - 150px)}
}

/* ---------- panel ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.07em}
.tag{border:1.5px solid var(--ink);border-radius:6px;padding:0 8px;font-size:10px;letter-spacing:.05em}
.tag.rose{background:var(--rose-t)}.tag.peach{background:var(--peach-t)}.tag.mint{background:var(--mint-t)}.tag.sky{background:var(--sky-t)}.tag.lav{background:var(--lav-t)}.tag.sun{background:var(--sun-t)}
.sc h2{font-size:19px;line-height:1.3;margin:10px 0;font-weight:800;letter-spacing:-.01em}
.sc .body p{margin:0 0 10px}
.callout{display:flex;gap:10px;border:1.5px solid;border-radius:10px;padding:10px 12px;margin:12px 0 2px;font-size:12px;line-height:1.55}
.callout .ic{margin-top:2px}
.callout.warn{background:var(--rose-t);border-color:var(--rose-s)}
.callout.key{background:var(--sun-t);border-color:var(--sun-s)}
.callout.de{background:var(--sky-t);border-color:var(--sky-s)}
.callout.think{background:var(--lav-t);border-color:var(--lav-s)}
.callout .ct{display:block;font-size:10px;letter-spacing:.07em;margin-bottom:2px}
.callout details{margin-top:6px}
.callout summary{cursor:pointer;font-weight:700}
.changes h3{font-size:11px;letter-spacing:.07em;margin:16px 0 6px;font-weight:800}
.changes ul{list-style:none;margin:0;padding:0}
.changes li{display:flex;gap:8px;align-items:baseline;font-size:12px;margin:4px 0}
.changes li::before{content:'~';display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--sun-t);border:1px solid var(--sun-s);font-size:11px;flex:none;line-height:1}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn.pri{flex:1;justify-content:space-between;min-width:0}
.nav .btn.pri span{overflow:hidden;text-overflow:ellipsis}
.keys{margin-top:10px;font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.keys kbd{font:inherit;border:1.5px solid var(--line);border-radius:4px;padding:0 5px;background:var(--paper)}
.learn h3{font-size:11px;letter-spacing:.07em;margin:0 0 8px;font-weight:800}
.learn ul{list-style:none;margin:0;padding:0}
.learn li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;margin:7px 0;color:var(--muted)}
.learn .box{width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;flex:none;margin-top:2px;display:grid;place-items:center;background:var(--surface);transition:background .25s}
.learn li.ok{color:var(--ink)}
.learn li.ok .box{background:var(--mint)}
.learn li.ok .box::after{content:'';width:7px;height:4px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translate(0,-1px) rotate(-45deg)}

/* ---------- stepper ---------- */
.stepper{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.stepper-h{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.07em;margin-bottom:10px}
.stepper-h span:last-child{color:var(--muted);font-weight:500;letter-spacing:0}
.steps{position:relative}
.steps::before{content:'';position:absolute;top:13px;left:calc(50% / var(--n));right:calc(50% / var(--n));height:2px;background:var(--line)}
.bar{position:absolute;top:12px;left:calc(50% / var(--n));height:4px;border-radius:2px;background:var(--ink);width:calc((100% - 100% / var(--n)) * var(--p));transition:width .45s cubic-bezier(.4,0,.2,1)}
.sitems{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.sitem{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;padding:0;font-size:11px;color:var(--muted)}
.sitem .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink);transition:background .2s,transform .2s,box-shadow .2s}
.sitem.done .dot{background:var(--mint-t)}
.sitem.cur .dot{background:var(--mint);box-shadow:2px 2px 0 var(--ink);transform:scale(1.08)}
.sitem.cur{color:var(--ink);font-weight:800}
.sitem:hover .dot{transform:translateY(-2px)}
.sitem .sl{text-align:center;line-height:1.3;padding:0 2px}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 16px;font-size:12.5px;transition:opacity .25s,transform .25s;z-index:60;box-shadow:4px 4px 0 var(--mint);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.c-lav{background:var(--lav)}.c-sky{background:var(--sky)}.c-mint{background:var(--mint)}.c-sun{background:var(--sun)}.c-rose{background:var(--rose)}.c-peach{background:var(--peach)}.c-ash{background:var(--ash)}
.blk.bad,.tk.bad{background:var(--rose);animation:shake .45s}
.blk.ok{background:var(--mint)}

@keyframes flash{0%{background:var(--sun-t);transform:translateY(-2px)}100%{background:var(--surface);transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes bump{0%{transform:none}40%{transform:scale(1.25) rotate(-5deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@keyframes stepb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cubeIn{0%{transform:translateY(-26px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes found{0%{transform:translateY(-10px)}35%{transform:translateY(-26px) scale(1.06)}100%{transform:translateY(-10px)}}
@keyframes burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-40px) scale(.4);opacity:0}}
@keyframes sqIn{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes rowIn{0%{transform:translateY(-6px);opacity:0}100%{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important;transition-delay:0ms!important}
}
@media (max-width:1180px){
  .app{grid-template-columns:220px minmax(0,1fr) 312px}
  .search{width:200px}
}
@media (max-width:1020px){
  .app{grid-template-columns:minmax(0,1fr) 312px}
  .side{display:none;position:fixed;z-index:40;left:0;top:58px;bottom:0;width:280px;background:var(--paper);box-shadow:6px 0 0 rgba(33,29,44,.12)}
  .app.side-open .side{display:block}
  .top .menu-btn{display:inline-flex;padding:6px 8px}
  .tabs{display:none}
  .search{margin-left:auto}
}
@media (max-width:760px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .main,.panel{overflow:visible;padding:12px}
  .search{display:none}
  .lh h1{font-size:23px}
  .stage{min-height:0}
}

<body>
<header class="top">
  <button class="btn menu-btn" id="menuBtn" aria-label="Mở danh sách bài học" aria-expanded="false"><span class="ic" data-ic="menu"></span></button>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="15" width="11" height="11" rx="2" style="fill:var(--lav);stroke:var(--ink);stroke-width:2"/><rect x="15" y="15" width="11" height="11" rx="2" style="fill:var(--sky);stroke:var(--ink);stroke-width:2"/><rect x="8.5" y="2.5" width="11" height="11" rx="2" style="fill:var(--mint);stroke:var(--ink);stroke-width:2"/></svg>
    <span>DSA <span class="hl">Visual</span></span>
  </div>
  <nav class="tabs" aria-label="Chế độ">
    <button class="tab on" aria-current="page"><span class="ic" data-ic="book"></span>Học</button>
    <button class="tab" data-soon="Luyện tập"><span class="ic" data-ic="target"></span>Luyện tập</button>
    <button class="tab" data-soon="Sân chơi"><span class="ic" data-ic="flask"></span>Sân chơi</button>
    <button class="tab" data-soon="Cheatsheet"><span class="ic" data-ic="grid"></span>Cheatsheet</button>
  </nav>
  <label class="search"><span class="ic" data-ic="search"></span><input id="q" type="search" placeholder="Tìm bài học…" aria-label="Tìm bài học" autocomplete="off"><kbd>Ctrl K</kbd></label>
</header>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Khoá học">
    <div class="side-h"><span class="ic" data-ic="folder"></span>Khoá học<small id="total"></small></div>
    <div id="course"></div>
  </aside>

  <main class="main">
    <section class="lesson">
      <div class="lh">
        <div>
          <div class="crumb" id="crumb"></div>
          <h1 id="lTitle"></h1>

        </div>
        <div class="chips" id="lChips"></div>

            <button class="btn" id="btnPause" aria-pressed="false"></button>
          </div>

        <div class="viz" id="viz"></div>
        <div class="legend" id="legend"></div>
      </section>
    </section>
    <section class="stepper" aria-label="Các bước trong bài">
      <div class="stepper-h"><span>TRONG BÀI NÀY</span><span id="stepCount"></span></div>

    </section>

  <aside class="panel" aria-label="Giải thích">

      </div>
      <div class="keys"><kbd>←</kbd><kbd>→</kbd> chuyển bước · <kbd>R</kbd> xem lại · <kbd>Space</kbd> tạm dừng</div>

    </section>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reflow = el => void el.offsetWidth;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const fmt = n => n.toLocaleString('vi-VN');
const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

const sv = (body, size = 15) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const I = {
  replay: sv('<polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>'),
  pause: sv('<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'),
  play: sv('<polygon points="6 4 20 12 6 20 6 4"/>'),
  clock: sv('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>', 13),
  bars: sv('<line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="9"/><line x1="18" y1="20" x2="18" y2="4"/>', 13),
  list: sv('<line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/>', 13),
  search: sv('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/>', 14),
  book: sv('<path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>'),
  target: sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
  flask: sv('<path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/>'),
  grid: sv('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
  chev: sv('<polyline points="9 6 15 12 9 18"/>', 13),
  check: sv('<circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/>', 14),
  file: sv('<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/>', 14),
  trend: sv('<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>', 13),
  menu: sv('<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>', 17),
  alert: sv('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 16),
  bulb: sv('<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>', 16),
  db: sv('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>', 16),
  help: sv('<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 16),
  left: sv('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>', 14),
  right: sv('<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>', 14),
  folder: '<svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path d="M1.5 3.5a2 2 0 0 1 2-2h4.2l2 2.2h8.8a2 2 0 0 1 2 2v9.3a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" style="fill:var(--ink);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round"/></svg>',
};
const folder = c => `<svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path d="M1.5 3.5a2 2 0 0 1 2-2h4.2l2 2.2h8.8a2 2 0 0 1 2 2v9.3a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" style="fill:${c};stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round"/></svg>`;

/* ================= scene engine ================= */
const S = { lesson: null, step: 0, gen: 0, paused: false, done: new Set(), seen: {}, open: new Set(['m2', 'm3']) };
const CANCEL = { cancelled: true };

// A wait that respects Pause and is cancelled when another scene starts.
function sleep(ms, gen) {
  return new Promise((res, rej) => {
    let left = RM.matches ? 0 : ms, last = performance.now();
    const tick = now => {
      if (gen !== S.gen) return rej(CANCEL);
      if (!S.paused) left -= Math.max(0, now - last);
      last = now;
      if (left <= 0) return res();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function setMetrics(list) {
  $('#metrics').innerHTML = list.map(m =>
    `<div class="metric t-${m.tone || 'n'}" data-k="${m.k}"><div class="ml">${m.label}</div><div class="mv">${esc(m.v)}</div></div>`).join('');
}
function metric(k, v, tone) {
  const el = $(`.metric[data-k="${k}"]`);
  if (!el) return;
  const mv = el.querySelector('.mv');
  if (mv.textContent === String(v) && !tone) return;
  mv.textContent = v;
  if (tone) el.className = `metric t-${tone}`;
  el.classList.remove('flash'); reflow(el); el.classList.add('flash');
}

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ================= binary search ================= */
const BS_ARR = [3, 8, 12, 17, 21, 26, 34, 41, 47, 55, 62, 66, 73, 80, 88, 95];

function bsTrace(arr, target) {
  const iters = [];
  let lo = 0, hi = arr.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1, val = arr[mid];
    if (val === target) { iters.push({ lo, hi, mid, val, cmp: 'eq', nlo: lo, nhi: hi }); return { iters, found: mid, lo, hi }; }
    if (val < target) { iters.push({ lo, hi, mid, val, cmp: 'lt', nlo: mid + 1, nhi: hi }); lo = mid + 1; }
    else { iters.push({ lo, hi, mid, val, cmp: 'gt', nlo: lo, nhi: mid - 1 }); hi = mid - 1; }
  }
  return { iters, found: -1, lo, hi };
}

const CUBE = '<svg viewBox="0 0 48 52" aria-hidden="true"><polygon class="t" points="2,10 10,2 46,2 38,10"/><polygon class="s" points="38,10 46,2 46,42 38,50"/><polygon class="f" points="2,10 38,10 38,50 2,50"/></svg>';
const FIG = `<svg viewBox="0 0 46 50" width="40" height="44" aria-hidden="true">
  <ellipse cx="20" cy="47" rx="13" ry="2.6" style="fill:rgba(33,29,44,.18)"/>
  <path d="M8 46V31a12 12 0 0 1 24 0v15z" style="fill:var(--peach);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round"/>
  <circle cx="20" cy="11" r="8" style="fill:#fffaf2;stroke:var(--ink);stroke-width:2.2"/>
  <line x1="34" y1="31" x2="41" y2="39" style="stroke:var(--ink);stroke-width:3.2;stroke-linecap:round"/>
  <circle cx="31" cy="27" r="6.5" style="fill:var(--sky-t);stroke:var(--ink);stroke-width:2.2"/>
</svg>`;

function chartSVG() {
  const W = 232, H = 124, x0 = 30, x1 = 222, y0 = 104, y1 = 10, NN = 64;
  const X = n => +(x0 + (n - 1) / (NN - 1) * (x1 - x0)).toFixed(1);
  const Y = v => +(y0 - v / NN * (y0 - y1)).toFixed(1);
  const bl = n => 32 - Math.clz32(n); // floor(log2 n) + 1
  let log = `M${X(1)},${Y(1)}`, prev = 1;
  for (let n = 2; n <= NN; n++) { const v = bl(n); if (v !== prev) { log += ` L${X(n)},${Y(prev)} L${X(n)},${Y(v)}`; prev = v; } }
  log += ` L${X(NN)},${Y(prev)}`;
  const grid = [16, 32, 48, 64].map(v => `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" class="g"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Linear search cần n lần so sánh, binary search cần khoảng log2 n lần. Với n bằng 16: 16 lần so với 5 lần.">
    ${grid}
    <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" class="ax"/>
    <text x="${x0 - 5}" y="${Y(64) + 3}" class="tl" text-anchor="end">64</text>
    <text x="${x0 - 5}" y="${Y(32) + 3}" class="tl" text-anchor="end">32</text>
    <text x="${x0 - 5}" y="${y0 + 3}" class="tl" text-anchor="end">0</text>
    <text x="${X(1)}" y="${y0 + 13}" class="tl" text-anchor="middle">1</text>
    <text x="${X(16)}" y="${y0 + 13}" class="tl" text-anchor="middle">16</text>
    <text x="${X(64)}" y="${y0 + 13}" class="tl" text-anchor="end">n = 64</text>
    <line x1="${X(16)}" x2="${X(16)}" y1="${y0}" y2="${Y(16)}" class="mk"/>
    <path d="M${X(1)},${Y(1)} L${X(64)},${Y(64)}" class="c-lin lin"/>
    <path d="${log}" class="c-log log"/>
    <circle cx="${X(16)}" cy="${Y(16)}" r="3.5" class="d-lin lin"/>
    <circle cx="${X(16)}" cy="${Y(5)}" r="3.5" class="d-log log"/>
    <text x="${X(16) - 6}" y="${Y(16) - 5}" class="vl lin" text-anchor="end">16</text>
    <text x="${X(16) + 3}" y="${Y(5) - 7}" class="vl log">5</text>
    <text x="${X(44)}" y="${Y(52)}" class="nm lin" text-anchor="end">linear O(n)</text>
    <text x="${X(64)}" y="${Y(7) - 6}" class="nm log" text-anchor="end">binary O(log n)</text>
  </svg>`;
}

  };

}

// Apply the end state of the first `count` iterations without animation.
function bsApply(v, iters, count) {
  let l = 0, h = v.N - 1;
  for (let j = 0; j < count; j++) {
    const it = iters[j];
    if (it.cmp === 'lt') v.cells(it.lo, it.mid, 'out');
    else if (it.cmp === 'gt') v.cells(it.mid, it.hi, 'out');
    l = it.nlo; h = it.nhi;
  }
  v.ptrs(l, h); v.range(l, h);
}

// Animate one loop iteration of binary search.
async function bsIter(api, v, it, target, count) {
  v.say(`mid = (${it.lo} + ${it.hi}) // 2 = ${it.mid}`);
  await api.wait(1000);
  v.walk(it.mid, 'hop'); v.cell(it.mid, 'mid');
  await api.wait(750);
  api.metric('c', count);
  if (it.cmp === 'eq') {
    v.cell(it.mid, 'found'); v.burst(it.mid);
    v.say(`arr[${it.mid}] = ${it.val}: tìm thấy!`, 'good');
    return;
  }
  const lt = it.cmp === 'lt';
  v.say(`${it.val} ${lt ? '<' : '>'} ${target} → bỏ nửa ${lt ? 'trái' : 'phải'}`);
  await api.wait(1100);
  if (lt) v.cells(it.lo, it.mid, 'out', 45, true);
  else v.cells(it.mid, it.hi, 'out', 45, false);
  v.ptrs(it.nlo, it.nhi); v.range(it.nlo, it.nhi);
  api.metric('k', Math.max(0, it.nhi - it.nlo + 1));
  api.metric('r', it.nlo <= it.nhi ? `[${it.nlo}..${it.nhi}]` : 'rỗng');
  await api.wait(950);
}

function makeST(root) {
  root.innerHTML = `
  <div class="st" data-mode="basic">
    <div class="st-left">
      <div class="tube-wrap">
        ${PLATE}
        <div class="tube" id="stTube"></div>
        <div class="top-ptr empty" id="stTop" style="--i:0"><i></i><span>top: rỗng</span></div>
        <div class="tube-cap">stack · phần tử mới nằm trên cùng</div>
      </div>
    </div>
    <div class="st-right">
      <div class="ncard tokcard"><div class="mc-h">CHUỖI ĐẦU VÀO <code id="stStr"></code></div><div class="tokens" id="stTok"></div><div class="result" id="stRes"></div></div>
      <div class="code"><div class="code-h"><i></i><i></i><i></i><span id="stFile">stack.py</span></div><pre id="stCode"></pre></div>
      <div class="ncard traycard"><div class="mc-h" id="stTrayH">ĐÃ POP (THEO THỨ TỰ LẤY RA)</div><div class="tray" id="stTray"></div></div>
    </div>
  </div>`;

  const st = $('.st', root), tube = $('#stTube', root), topP = $('#stTop', root);
  const tok = $('#stTok', root), res = $('#stRes', root), code = $('#stCode', root), tray = $('#stTray', root);
  const CAP = 5, SLOT = 46;
  const COL = { A: 'lav', B: 'sky', C: 'mint', D: 'sun', '(': 'lav', '[': 'sky', '{': 'mint', 'main()': 'peach', 'run_pipeline()': 'sky', 'load_table()': 'lav', 'parse_row()': 'mint' };
  let items = [];
  const updTop = () => {
    const n = items.length;
    topP.style.setProperty('--i', Math.max(n - 1, 0));
    topP.querySelector('span').textContent = n ? 'top' : 'top: rỗng';
    topP.classList.toggle('empty', !n);
  };
  const chip = (label, extra = '') => `<span class="chipx c-${COL[label] || 'ash'}">${esc(label)}${extra}</span>`;

  const v = {
    mode(m) { st.dataset.mode = m; },
    instant(fn) { st.classList.add('no-anim'); fn(); reflow(st); st.classList.remove('no-anim'); },
    clear() { tube.innerHTML = ''; items = []; updTop(); },
    set(labels) { v.clear(); labels.forEach(l => v.push(l)); },
    push(label) {
      const i = items.length, el = document.createElement('div');
      el.className = `blk c-${COL[label] || 'lav'}`;
      el.style.setProperty('--i', i);
      el.innerHTML = `<span>${esc(label)}</span>`;
      el.style.transform = `translateY(${-((CAP - i) * SLOT + 60)}px)`;
      el.style.opacity = '0';
      tube.appendChild(el); reflow(el);
      el.style.transform = ''; el.style.opacity = '';
      items.push({ label, el }); updTop();
    },
    pop() {
      const it = items.pop(); if (!it) return null;
      const i = items.length, el = it.el;
      el.classList.add('leaving');
      el.style.transform = `translate(170px, ${-((CAP - i) * SLOT + 40)}px) rotate(12deg)`;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 900);
      updTop();
      return it.label;
    },
    mark(cls) { const it = items[items.length - 1]; if (it) { it.el.classList.remove('bad', 'ok'); reflow(it.el); it.el.classList.add(cls); } },
    peek() { return items.length ? items[items.length - 1].label : null; },
    size() { return items.length; },
    color(label) { return COL[label] || 'lav'; },
    tray(list) { tray.innerHTML = list.map(x => chip(x)).join(''); },
    addTray(label, extra) { tray.insertAdjacentHTML('beforeend', chip(label, extra)); },
    trayTitle(t) { $('#stTrayH', root).textContent = t; },
    tokens(s) { $('#stStr', root).textContent = `s = "${s}"`; tok.innerHTML = [...s].map(c => `<span class="tk">${esc(c)}</span>`).join(''); },
    cursor(i) { $$('.tk', tok).forEach((t, j) => t.classList.toggle('cur', j === i)); },
    tok(i, cls) { const t = $$('.tk', tok)[i]; if (t) { t.classList.remove('open'); t.classList.add(...cls.split(' ')); } },
    result(text, tone = '') { res.textContent = text; res.className = 'result'; if (text) { reflow(res); res.className = 'result pop' + (tone ? ' c-' + (tone === 'good' ? 'mint' : 'rose') : ''); } },
    code(lines, file) { code.innerHTML = codeHTML(lines); if (file) $('#stFile', root).textContent = file; },
    hl(ns) { $$('.ln', code).forEach(l => l.classList.toggle('on', ns.includes(+l.dataset.n))); },
  };
  return v;
}

const stMetrics = (size, top, op) => [
  { k: 'size', label: 'Size', v: String(size) }, { k: 'top', label: 'Top', v: top },

];

async function runBrackets(api, v, s) {
  v.instant(() => { v.clear(); v.tokens(s); v.result(''); v.hl([]); });
  api.metrics([
    { k: 's', label: 'Đã đọc', v: `0 / ${s.length}` }, { k: 'size', label: 'Size', v: '0' },
    { k: 'top', label: 'Top', v: '—' }, { k: 'res', label: 'Kết quả', v: '…' },
  ]);
  const pairs = { ')': '(', ']': '[', '}': '{' }, openAt = [];
  await api.wait(600);
  v.hl([2]); await api.wait(500);
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    v.cursor(i); api.metric('s', `${i + 1} / ${s.length}`); v.hl([3]);
    await api.wait(450);
    if ('([{'.includes(ch)) {
      v.hl([4, 5]); v.push(ch); openAt.push(i); v.tok(i, 'open');
      api.metric('size', v.size()); api.metric('top', ch);
      await api.wait(850);
      continue;
    }
    v.hl([6]); await api.wait(500);
    if (!v.size()) {
      v.tok(i, 'bad'); v.hl([7]); v.cursor(-1);
      v.result(`KHÔNG HỢP LỆ: gặp ${ch} khi stack rỗng`, 'bad'); api.metric('res', 'sai', 'bad');
      return false;
    }
    const top = v.peek();
    if (top !== pairs[ch]) {
      v.mark('bad'); v.tok(i, 'bad');
      await api.wait(700);
      v.pop(); v.hl([7]); v.cursor(-1);
      api.metric('size', v.size()); api.metric('top', v.peek() || '—');
      v.result(`KHÔNG HỢP LỆ: ${ch} không khớp ${top}`, 'bad'); api.metric('res', 'sai', 'bad');
      return false;
    }
    v.mark('ok'); await api.wait(450);
    v.pop();
    const c = 'c-' + v.color(top);
    v.tok(openAt.pop(), c); v.tok(i, c);
    api.metric('size', v.size()); api.metric('top', v.peek() || '—');
    await api.wait(750);
  }
  v.cursor(-1); v.hl([8]); await api.wait(450);
  if (v.size()) {
    openAt.forEach(j => v.tok(j, 'bad'));
    v.result(`KHÔNG HỢP LỆ: còn ${v.peek()} trong stack`, 'bad'); api.metric('res', 'sai', 'bad');
    return false;
  }
  v.result('HỢP LỆ: stack rỗng', 'good'); api.metric('res', 'hợp lệ', 'good');
  return true;
}

      const v = api.v;

      v.instant(() => { v.clear(); v.tray([]); v.trayTitle('ĐÃ RETURN (THEO THỨ TỰ)'); v.code(CODE_CALL, 'pipeline.py'); });
      api.metrics([
        { k: 'd', label: 'Độ sâu', v: '0' }, { k: 'run', label: 'Đang chạy', v: '—' },
        { k: 'op', label: 'Sự kiện', v: '—' }, { k: 'lim', label: 'Giới hạn mặc định', v: '1000 tầng' },
      ]);
      const ev = [
        ['call', 'main()', [1]], ['call', 'run_pipeline()', [2, 4]], ['call', 'load_table()', [5, 7]], ['call', 'parse_row()', [8, 10]],
        ['ret', null, [11]], ['ret', null, [8]], ['ret', null, [5]], ['ret', null, [2]],
      ];
      await api.wait(600);
      for (const [kind, name, ln] of ev) {
        v.hl(ln); await api.wait(450);
        if (kind === 'call') { v.push(name); api.metric('op', `gọi ${name}`); }
        else { const x = v.pop(); v.addTray(x); api.metric('op', `${x} return`); }
        api.metric('d', v.size()); api.metric('run', v.peek() || '—');
        await api.wait(950);
      }
      v.hl([]);
    },
  },
];

/* ================= course data ================= */
const LESSONS = {
  'binary-search': {
    id: 'binary-search', mod: 'm2', title: 'Binary Search', minutes: 8, level: 'Cơ bản',
    sub: 'Mỗi lần so sánh loại cả nửa mảng. Vì sao tìm trong 1 tỷ phần tử chỉ cần khoảng 30 bước.',
    make: makeBS, steps: BS_STEPS,
    legend: [{ c: 'peach', t: 'đang xét (linear)' }, { c: 'sun', t: 'mid' }, { c: 'ash', t: 'đã loại' }, { c: 'mint', t: 'tìm thấy' }, { dash: true, t: 'khoảng [lo..hi]' }],
    learn: [
      { t: 'Phân biệt linear search và binary search', at: 1 },
      { t: 'Hiểu vì sao cần dữ liệu sorted', at: 2 },
      { t: 'Theo dõi lo, mid, hi qua từng vòng', at: 3 },
      { t: 'Xử lý trường hợp không tìm thấy', at: 5 },
      { t: 'Giải thích O(log n) bằng phép chia đôi', at: 6 },
    ],
  },
  'stack': {
    id: 'stack', mod: 'm3', title: 'Stack', minutes: 6, level: 'Cơ bản',
    sub: 'Cấu trúc vào sau, ra trước. Dùng để kiểm tra ngoặc, và chính là cách Python theo dõi các lời gọi hàm.',
    make: makeST, steps: ST_STEPS,
    legend: [{ c: 'lav', t: 'phần tử' }, { c: 'sun', t: 'top' }, { c: 'mint', t: 'khớp cặp' }, { c: 'rose', t: 'lỗi' }],
    learn: [
      { t: 'Hiểu quy tắc LIFO', at: 0 },
      { t: 'push và pop đều O(1)', at: 2 },
      { t: 'Dùng stack để kiểm tra ngoặc', at: 3 },
      { t: 'Nhận ra các trường hợp ngoặc sai', at: 4 },
      { t: 'Hiểu call stack và RecursionError', at: 5 },
    ],
  },
};
const ORDER = ['binary-search', 'stack'];

const COURSE = [
  { id: 'm1', name: '01. Nền tảng', color: '#f7c696', lessons: [{ t: 'Big-O trong 5 phút' }, { t: 'Array và bộ nhớ' }] },
  { id: 'm2', name: '02. Tìm kiếm', color: '#bde3b1', lessons: [{ t: 'Binary Search', id: 'binary-search' }, { t: 'Two Pointers' }] },
  { id: 'm3', name: '03. Cấu trúc tuyến tính', color: '#cdc2ec', lessons: [{ t: 'Stack', id: 'stack' }, { t: 'Queue' }, { t: 'Linked List' }] },
  { id: 'm4', name: '04. Hashing', color: '#f4b8b0', lessons: [{ t: 'Hash Table' }, { t: 'Xử lý collision' }, { t: 'Consistent Hashing' }] },
  { id: 'm5', name: '05. Cây', color: '#bad5f2', lessons: [{ t: 'Binary Search Tree' }, { t: 'Heap' }, { t: 'B-tree' }] },
  { id: 'm6', name: '06. Đồ thị', color: '#f6d77b', lessons: [{ t: 'BFS' }, { t: 'DFS' }, { t: 'Topological Sort' }] },
  { id: 'm7', name: '07. Sắp xếp', color: '#f7c696', lessons: [{ t: 'Merge Sort' }, { t: 'Quick Sort' }, { t: 'External Sort' }] },
  { id: 'm8', name: '08. Quy hoạch động', color: '#bde3b1', lessons: [{ t: 'Memoization' }, { t: 'Knapsack' }] },
];

try { JSON.parse(localStorage.getItem('dsa-visual-done') || '[]').forEach(x => LESSONS[x] && S.done.add(x)); } catch (e) { /* storage unavailable */ }
const saveDone = () => { try { localStorage.setItem('dsa-visual-done', JSON.stringify([...S.done])); } catch (e) { /* ignore */ } };

/* ================= rendering ================= */
function renderSidebar() {
  const raw = $('#q').value.trim(), q = norm(raw);
  const total = COURSE.reduce((a, m) => a + m.lessons.length, 0);
  $('#total').textContent = `${total} bài`;
  const html = COURSE.map(m => {
    const ls = m.lessons.filter(l => !q || norm(l.t).includes(q) || norm(m.name).includes(q));
    if (q && !ls.length) return '';
    const open = q ? true : S.open.has(m.id);
    const done = m.lessons.filter(l => l.id && S.done.has(l.id)).length;
    return `<div class="mod${open ? ' open' : ''}">
      <button class="mod-btn" data-mod="${m.id}" aria-expanded="${open}"><span class="ic chev">${I.chev}</span>${folder(m.color)}<span>${m.name}</span><span class="cnt">${done}/${m.lessons.length}</span></button>
      <ul class="les">${ls.map(l => {
        const built = !!l.id, on = built && l.id === S.lesson, ok = built && S.done.has(l.id);
        const ic = ok ? `<span class="ic ok-ic">${I.check}</span>` : `<span class="ic">${I.file}</span>`;
        return `<li><button class="${on ? 'on' : ''}${built ? '' : ' soon'}" ${built ? `data-l="${l.id}"` : `data-soon="${esc(l.t)}"`}${on ? ' aria-current="page"' : ''}>${ic}<span>${esc(l.t)}</span>${built ? '' : '<span class="tagsoon">sắp có</span>'}</button></li>`;
      }).join('')}</ul></div>`;
  }).join('');
  $('#course').innerHTML = html || `<p class="empty">Không có bài nào khớp "${esc(raw)}".</p>`;
}

function renderHead(L) {
  const mod = COURSE.find(m => m.id === L.mod), idx = mod.lessons.findIndex(x => x.id === L.id);
  $('#crumb').innerHTML = `${esc(mod.name)} &nbsp;/&nbsp; <b>Bài ${idx + 1} trong ${mod.lessons.length}</b>`;
  $('#lTitle').textContent = L.title;
  $('#lSub').textContent = L.sub;
  $('#lChips').innerHTML = `<span class="chip c1">${I.clock}${L.minutes} phút</span><span class="chip c2">${I.bars}${L.level}</span><span class="chip c3">${I.list}${L.steps.length} bước</span>`;
  $('#legend').innerHTML = L.legend.map(x => `<span><i class="${x.dash ? 'dash' : 'c-' + x.c}"></i>${x.t}</span>`).join('');
  document.title = `${L.title} · DSA Visual`;
}

function calloutHTML(c) {
  const ic = { warn: I.alert, key: I.bulb, de: I.db, think: I.help }[c.kind];
  return `<div class="callout ${c.kind}"><span class="ic">${ic}</span><div><b class="ct">${c.title}</b>${c.text}${c.answer ? `<details><summary>Xem đáp án</summary>${c.answer}</details>` : ''}</div></div>`;
}

const nextLessonId = () => ORDER[ORDER.indexOf(S.lesson) + 1] || null;

function renderPanel() {
  const L = LESSONS[S.lesson], st = L.steps[S.step], n = L.steps.length;
  $('#stepNo').textContent = `BƯỚC ${S.step + 1} / ${n}`;
  const tag = $('#stepTag'); tag.textContent = st.tag; tag.className = `tag ${st.tone}`;
  $('#stepTitle').textContent = st.title;
  $('#stepBody').innerHTML = st.body.map(p => `<p>${p}</p>`).join('');
  $('#stepCallout').innerHTML = st.callout ? calloutHTML(st.callout) : '';
  $('#stepChanges').innerHTML = st.changes ? `<h3>THAY ĐỔI</h3><ul>${st.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '';
  $('#btnBack').disabled = S.step === 0;
  const nx = nextLessonId();
  $('#nextLbl').textContent = S.step < n - 1 ? `Tiếp: ${L.steps[S.step + 1].short}` : (nx ? `Bài tiếp: ${LESSONS[nx].title}` : 'Học lại từ đầu');
}

function renderStepper() {
  const L = LESSONS[S.lesson], n = L.steps.length, el = $('#steps');
  el.style.setProperty('--n', n);
  el.style.setProperty('--p', n > 1 ? S.step / (n - 1) : 0);
  $('#sitems').innerHTML = L.steps.map((s, i) =>
    `<button class="sitem${i < S.step ? ' done' : ''}${i === S.step ? ' cur' : ''}" data-s="${i}" aria-label="Bước ${i + 1}: ${esc(s.short)}"${i === S.step ? ' aria-current="step"' : ''}><span class="dot">${i + 1}</span><span class="sl">${esc(s.short)}</span></button>`).join('');
  $('#stepCount').textContent = `Bước ${S.step + 1} / ${n}`;
}

function renderLearn() {
  const L = LESSONS[S.lesson], seen = S.seen[S.lesson] || new Set();
  const maxSeen = Math.max(-1, ...seen);
  $('#learnList').innerHTML = L.learn.map(x => `<li class="${maxSeen >= x.at ? 'ok' : ''}"><span class="box"></span><span>${esc(x.t)}</span></li>`).join('');
}

function setPaused(p) {
  S.paused = p;
  $('#stage').classList.toggle('paused', p);
  const b = $('#btnPause');
  b.innerHTML = p ? `<span class="ic">${I.play}</span>Tiếp tục` : `<span class="ic">${I.pause}</span>Tạm dừng`;
  b.setAttribute('aria-pressed', String(p));
}

function play() {
  const L = LESSONS[S.lesson];
  S.gen++; setPaused(false);
  const gen = S.gen;
  const api = { v: L.v, wait: ms => sleep(ms, gen), metrics: setMetrics, metric };
  L.steps[S.step].run(api).catch(e => { if (e !== CANCEL) console.error(e); });
}

function goStep(i) {
  const L = LESSONS[S.lesson];
  S.step = Math.max(0, Math.min(L.steps.length - 1, i));
  (S.seen[S.lesson] = S.seen[S.lesson] || new Set()).add(S.step);
  if (S.step === L.steps.length - 1 && !S.done.has(S.lesson)) { S.done.add(S.lesson); saveDone(); renderSidebar(); }
  renderPanel(); renderStepper(); renderLearn();
  play();
}

function openLesson(id, step = 0) {
  const L = LESSONS[id]; if (!L) return;
  if (S.lesson !== id) {
    S.lesson = id;
    S.open.add(L.mod);
    renderHead(L);
    L.v = L.make($('#viz'));
    renderSidebar();
    try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e) { /* sandboxed frame */ }
  }
  goStep(step);
}

const next = () => {
  const L = LESSONS[S.lesson];
  if (S.step < L.steps.length - 1) goStep(S.step + 1);
  else openLesson(nextLessonId() || ORDER[0], 0);
};
const back = () => { if (S.step > 0) goStep(S.step - 1); };
const closeSide = () => { $('#app').classList.remove('side-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); };

/* ================= events ================= */
$$('[data-ic]').forEach(el => { el.innerHTML = I[el.dataset.ic] || ''; });
$('#btnNext').addEventListener('click', next);
$('#btnBack').addEventListener('click', back);
$('#btnReplay').addEventListener('click', play);
$('#btnPause').addEventListener('click', () => setPaused(!S.paused));
$('#sitems').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) goStep(+b.dataset.s); });
$('#course').addEventListener('click', e => {
  const m = e.target.closest('[data-mod]');
  if (m) { const id = m.dataset.mod; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderSidebar(); return; }
  const l = e.target.closest('[data-l]');
  if (l) { openLesson(l.dataset.l, 0); closeSide(); return; }
  const s = e.target.closest('[data-soon]');
  if (s) toast(`"${s.dataset.soon}" chưa có trong bản demo. Thử Binary Search hoặc Stack.`);
});
$$('.tab[data-soon]').forEach(t => t.addEventListener('click', () => toast(`Bản demo chỉ có phần Học, chưa có ${t.dataset.soon}.`)));
$('#q').addEventListener('input', renderSidebar);
$('#menuBtn').addEventListener('click', () => {
  const open = $('#app').classList.toggle('side-open');
  $('#menuBtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); return; }
  if (tag === 'input' || tag === 'textarea') {
    if (e.key === 'Escape') { e.target.value = ''; renderSidebar(); e.target.blur(); }
    return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  else if (e.key === 'r' || e.key === 'R') play();
  else if (e.key === ' ' && tag !== 'summary') { e.preventDefault(); setPaused(!S.paused); }
  else if (e.key === 'Escape') closeSide();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (LESSONS[h] && h !== S.lesson) openLesson(h, 0); });

const startId = location.hash.slice(1);
openLesson(LESSONS[startId] ? startId : ORDER[0], 0);
})();
</script>
</body>
</html>
