name: ci
on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # kiểm tra bản mới nhất trên GitHub Marketplace
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e # Playwright tự bật server bằng webServer trong playwright.config.ts
